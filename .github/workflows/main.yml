name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check links
        run: nix-shell --run "zola check --drafts"
      - name: Build site
        # out of the store, wrangler wants a writable directory
        run: cp -rL --no-preserve=mode,ownership "$(nix-build --no-out-link)" site
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.0"
          command: deploy --config site/wrangler.jsonc
