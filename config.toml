base_url = "https://toniogela.dev"
default_language = "en"
compile_sass = true
generate_feeds = true
feed_limit = 1000
feed_filenames = ["rss.xml"]
title = "TonioGela's"
description = "\"In order to understand recursion, one must first understand recursion\""
build_search_index = false
minify_html = true

[markdown]
render_emoji = true

[markdown.highlighting]
error_on_missing_language = true
highlight_code = true
extra_grammars = [ "syntaxes/just.json", "syntaxes/cli.json", "syntaxes/tree.json" ]
theme = "nord"

[link_checker]
skip_prefixes = [
    "https://twitter.com", # Twitter returns 403 in most cases
]
skip_anchor_prefixes = [
    "https://github.com/casey/just", # I'm simply too lazy to fix that post
    "https://github.com/cli/cli",    # It can't find #installation on the page, idk why
]

[extra]
profile = "avatar.webp"
author = "Antonio Gelameris"

[extra.authors]
"TonioGela" = "https://github.com/TonioGela"

[[extra.socials]]
icon = "github"
uri = "https://github.com/TonioGela"

[[extra.socials]]
icon = "mastodon"
uri = "https://hachyderm.io/@toniogela"

[[extra.socials]]
icon = "terminal"
display = "about me"
uri = "/about"
blank = false

[[extra.socials]]
icon = "linkedin"
uri = "https://www.linkedin.com/in/toniogela/"
